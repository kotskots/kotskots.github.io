name: Reclaim Android 1.0 Production Build 2

on:
  push:
    branches: [reclaim-v1-production-build]
    paths:
      - '.github/workflows/reclaim-v1-production-build2.yml'

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
    steps:
      - name: Checkout production assets
        uses: actions/checkout@v4

      - name: Checkout verified Reclaim feature source
        uses: actions/checkout@v4
        with:
          ref: reclaim-v04-beta1-build2
          path: reclaim-source

      - name: Reconstruct Reclaim 1.0 source
        shell: bash
        run: |
          set -euo pipefail
          cat \
            reclaim-source/.reclaim-v04-beta1-feature/part00 \
            reclaim-source/.reclaim-v04-beta1-feature/part00b \
            reclaim-source/.reclaim-v04-beta1-feature/part00c \
            reclaim-source/.reclaim-v04-beta1-feature/part01 \
            reclaim-source/.reclaim-v04-beta1-feature/part02 \
            reclaim-source/.reclaim-v04-beta1-feature/part03a \
            reclaim-source/.reclaim-v04-beta1-feature/part03b \
            reclaim-source/.reclaim-v04-beta1-feature/part03c \
            reclaim-source/.reclaim-v04-beta1-feature/part03d \
            reclaim-source/.reclaim-v04-beta1-feature/part04 \
            > /tmp/reclaim-feature.b64
          base64 --decode /tmp/reclaim-feature.b64 > /tmp/base.zip
          echo '9778ef98f4f3c916f393f8ce07319f8c154147a17e937b0495aacea13a74e084  /tmp/base.zip' | sha256sum -c -
          rm -rf /tmp/reclaim-v1 && mkdir -p /tmp/reclaim-v1
          unzip -q /tmp/base.zip -d /tmp/reclaim-v1
          cd /tmp/reclaim-v1/reclaim_feature_android_beta
          patch -p1 < "$GITHUB_WORKSPACE/reclaim-source/.reclaim-v04-beta1-feature/compile-fixes.patch"
          cp "$GITHUB_WORKSPACE/reclaim-source/.reclaim-v04-beta2-overrides/WorkBlockAccessibilityService.kt" app/src/main/java/com/kostas/reclaim/WorkBlockAccessibilityService.kt

          python - <<'PY'
          from pathlib import Path
          import re
          root=Path('/tmp/reclaim-v1/reclaim_feature_android_beta')
          g=root/'app/build.gradle.kts'
          s=g.read_text().replace('versionCode = 5','versionCode = 6').replace('versionName = "0.4.0-beta1"','versionName = "0.4.1-beta2"')
          g.write_text(s)
          hub=root/'app/src/main/java/com/kostas/reclaim/FeatureHubScreen.kt'
          h=hub.read_text().replace('Selected apps are interrupted with a reason prompt and countdown when you open them outside a focus session.','Selected apps show a Reclaim pause over the app every time you enter them. The app stays open underneath while you wait and choose why you opened it.').replace('Manage distraction apps','Choose apps for pause screen').replace('Distraction apps','Pause screen apps')
          hub.write_text(h)
          service=root/'app/src/main/java/com/kostas/reclaim/WorkBlockAccessibilityService.kt'
          w=service.read_text()
          pat=r'        if \(packageName == applicationContext\.packageName\) \{\s*frictionBypassPackage = null\s*removeFrictionOverlay\(\)\s*return\s*\}'
          w2,n=re.subn(pat,'        if (packageName == applicationContext.packageName) return',w,count=1)
          if n!=1: raise SystemExit(f'own-package normalize count={n}')
          service.write_text(w2)
          PY

          base64 --decode "$GITHUB_WORKSPACE/.reclaim-build-patches/android-v043-beta4.patch.gz.b64" > /tmp/b4.gz
          gzip -dc /tmp/b4.gz > /tmp/b4.patch
          echo '6177e6478d325196f994fa37e21414ae1dd61d63dfa2753c916ff993c6bb5e24  /tmp/b4.patch' | sha256sum -c -
          patch -p1 < /tmp/b4.patch

          cat "$GITHUB_WORKSPACE/.reclaim-v1-production/patch00" "$GITHUB_WORKSPACE/.reclaim-v1-production/patch01" "$GITHUB_WORKSPACE/.reclaim-v1-production/patch02" "$GITHUB_WORKSPACE/.reclaim-v1-production/patch03" > /tmp/v1.b64
          base64 --decode /tmp/v1.b64 > /tmp/v1.gz
          gzip -dc /tmp/v1.gz > /tmp/v1.patch
          echo 'bd46993e550ff32098fc6b11f85154b445053f41c4c8c0c51f304227c3caa705  /tmp/v1.patch' | sha256sum -c -
          python - <<'PY'
          from pathlib import Path
          p=Path('/tmp/v1.patch').read_text()
          marker='diff --git a/app/src/main/java/com/kostas/reclaim/WorkBlockAccessibilityService.kt b/app/src/main/java/com/kostas/reclaim/WorkBlockAccessibilityService.kt\n'
          if marker not in p: raise SystemExit('WorkBlock marker missing')
          Path('/tmp/v1-clean.patch').write_text(p.split(marker,1)[0])
          PY
          patch -p1 < /tmp/v1-clean.patch

          base64 --decode "$GITHUB_WORKSPACE/.reclaim-v1-production/workblock-final.kt.gz.b64" > /tmp/wb.gz
          gzip -dc /tmp/wb.gz > app/src/main/java/com/kostas/reclaim/WorkBlockAccessibilityService.kt
          echo '55884d71b1b545cab8d5fa201669413a82b84635ae1bffefb8c52a244a8daaad  app/src/main/java/com/kostas/reclaim/WorkBlockAccessibilityService.kt' | sha256sum -c -

          # Fix the missing close brace inside the Locked-mode settings item.
          python - <<'PY'
          from pathlib import Path
          p=Path('app/src/main/java/com/kostas/reclaim/ProductionScreens.kt')
          lines=p.read_text().splitlines()
          hits=[]
          for i,line in enumerate(lines):
              if 'Emergency unlock' in line and line.lstrip().startswith('item{Card{Column'):
                  lines[i]=line+'}'
                  hits.append(i)
          if len(hits)!=1: raise SystemExit(f'Emergency Unlock line hits={len(hits)}')
          s='\n'.join(lines)+'\n'
          p.write_text(s)
          state='code'; i=0; bal=0
          while i<len(s):
              c=s[i]; n=s[i+1] if i+1<len(s) else ''
              if state=='code':
                  if c=='/' and n=='/': state='line'; i+=1
                  elif c=='/' and n=='*': state='block'; i+=1
                  elif s[i:i+3]=='"""': state='triple'; i+=2
                  elif c=='"': state='string'
                  elif c=="'": state='char'
                  elif c=='{': bal+=1
                  elif c=='}': bal-=1
              elif state=='line':
                  if c=='\n': state='code'
              elif state=='block':
                  if c=='*' and n=='/': state='code'; i+=1
              elif state=='string':
                  if c=='\\': i+=1
                  elif c=='"': state='code'
              elif state=='char':
                  if c=='\\': i+=1
                  elif c=="'": state='code'
              elif state=='triple':
                  if s[i:i+3]=='"""': state='code'; i+=2
              i+=1
          if bal!=0: raise SystemExit(f'ProductionScreens brace balance={bal}')
          PY

          grep -q 'versionCode = 10' app/build.gradle.kts
          grep -q 'versionName = "1.0.0"' app/build.gradle.kts
          grep -q 'fun ProductionSmokingScreen' app/src/main/java/com/kostas/reclaim/ProductionScreens.kt
          grep -q 'fun ProductionSettingsScreen' app/src/main/java/com/kostas/reclaim/ProductionScreens.kt
          grep -q 'data class AppLimit' app/src/main/java/com/kostas/reclaim/Models.kt
          test ! -f app/src/main/java/com/kostas/reclaim/CloudSync.kt
          test ! -f app/src/main/java/com/kostas/reclaim/CloudSyncService.kt

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK
        shell: bash
        run: |
          set -euo pipefail
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platforms;android-35" "build-tools;35.0.0" "platform-tools"

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v5
        with:
          gradle-version: '8.9'

      - name: Build production release
        working-directory: /tmp/reclaim-v1/reclaim_feature_android_beta
        run: gradle --no-daemon :app:assembleRelease

      - name: Download permanent signing key
        uses: actions/download-artifact@v5
        with:
          name: Reclaim-signing-backup-v0.2
          path: /tmp/signing-artifact
          github-token: ${{ github.token }}
          repository: kotskots/kotskots.github.io
          run-id: 36263273293

      - name: Sign and verify Reclaim 1.0
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/signing
          unzip -q /tmp/signing-artifact/Reclaim-signing-backup-v0.2.zip -d /tmp/signing
          PASS=$(cat /tmp/signing/reclaim-keystore-password.txt)
          UNSIGNED=/tmp/reclaim-v1/reclaim_feature_android_beta/app/build/outputs/apk/release/app-release-unsigned.apk
          ALIGNED=/tmp/Reclaim-v1.0.0-aligned.apk
          SIGNED=/tmp/Reclaim-v1.0.0.apk
          BT="$ANDROID_HOME/build-tools/35.0.0"
          "$BT/zipalign" -p -f 4 "$UNSIGNED" "$ALIGNED"
          "$BT/apksigner" sign --ks /tmp/signing/reclaim-release.jks --ks-key-alias reclaim --ks-pass "pass:$PASS" --key-pass "pass:$PASS" --v2-signing-enabled true --v3-signing-enabled true --out "$SIGNED" "$ALIGNED"
          "$BT/apksigner" verify --verbose --print-certs "$SIGNED" | tee /tmp/signature.txt
          "$BT/aapt" dump badging "$SIGNED" | head -n 3 | tee /tmp/package.txt
          grep -q "package: name='com.kostas.reclaim' versionCode='10' versionName='1.0.0'" /tmp/package.txt
          grep -q "Verified using v2 scheme (APK Signature Scheme v2): true" /tmp/signature.txt
          grep -q "Verified using v3 scheme (APK Signature Scheme v3): true" /tmp/signature.txt
          grep -qi 'd5933ab2b7662c1606fb6b63e422eafe417e690fc5ca057de52d72cce571cd83' /tmp/signature.txt
          sha256sum "$SIGNED" | tee /tmp/sha256.txt

      - name: Upload production APK
        uses: actions/upload-artifact@v4
        with:
          name: Reclaim-v1.0.0-Android
          path: |
            /tmp/Reclaim-v1.0.0.apk
            /tmp/signature.txt
            /tmp/package.txt
            /tmp/sha256.txt
          if-no-files-found: error
