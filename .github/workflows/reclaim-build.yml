name: Build Reclaim APK

on:
  push:
    branches:
      - reclaim-apk-build-v01

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK packages
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platforms;android-37" "build-tools;37.0.0" "platform-tools"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.0'

      - name: Reassemble source project
        run: |
          cat .reclaim-build/part* > /tmp/reclaim.b64
          base64 --decode /tmp/reclaim.b64 > /tmp/Reclaim-v0.1.zip
          unzip -q /tmp/Reclaim-v0.1.zip -d /tmp/reclaim-src
          test -f /tmp/reclaim-src/Reclaim/app/build.gradle.kts

      - name: Build debug APK
        working-directory: /tmp/reclaim-src/Reclaim
        run: gradle --no-daemon :app:assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Reclaim-v0.1-apk
          path: /tmp/reclaim-src/Reclaim/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
