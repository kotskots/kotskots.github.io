name: Build Reclaim APK

on:
  push:
    branches:
      - reclaim-apk-build-v01

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK packages
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platforms;android-35" "build-tools;35.0.0" "platform-tools"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Reassemble source project
        run: |
          cat .reclaim-build/part* > /tmp/reclaim.b64
          base64 --decode /tmp/reclaim.b64 > /tmp/Reclaim-v0.1.zip
          unzip -q /tmp/Reclaim-v0.1.zip -d /tmp/reclaim-src
          test -f /tmp/reclaim-src/Reclaim/app/build.gradle.kts
          sed -i 's/compileSdk = 37/compileSdk = 35/' /tmp/reclaim-src/Reclaim/app/build.gradle.kts
          sed -i 's/targetSdk = 36/targetSdk = 35/' /tmp/reclaim-src/Reclaim/app/build.gradle.kts
          sed -i 's/com.android.application") version "9.4.0"/com.android.application") version "8.7.3"/' /tmp/reclaim-src/Reclaim/build.gradle.kts
          sed -i 's/org.jetbrains.kotlin.android") version "2.4.10"/org.jetbrains.kotlin.android") version "2.0.21"/' /tmp/reclaim-src/Reclaim/build.gradle.kts
          sed -i 's/org.jetbrains.kotlin.plugin.compose") version "2.4.10"/org.jetbrains.kotlin.plugin.compose") version "2.0.21"/' /tmp/reclaim-src/Reclaim/build.gradle.kts
          sed -i '/android.builtInKotlin=false/d' /tmp/reclaim-src/Reclaim/gradle.properties
          sed -i '/android.newDsl=false/d' /tmp/reclaim-src/Reclaim/gradle.properties
          python3 - <<'PY'
          from pathlib import Path
          p = Path('/tmp/reclaim-src/Reclaim/app/build.gradle.kts')
          s = p.read_text()
          old = '''dependencies {
    val composeBom = platform("androidx.compose:compose-bom:2026.09.00")
    implementation(composeBom)

    implementation("androidx.core:core-ktx:1.18.0")
    implementation("androidx.activity:activity-compose:1.12.3")
    implementation("androidx.compose.ui:ui")
    implementation("androidx.compose.ui:ui-tooling-preview")
    implementation("androidx.compose.material3:material3")
    implementation("androidx.compose.material:material-icons-extended")

    debugImplementation("androidx.compose.ui:ui-tooling")
}
'''
          new = '''dependencies {
    implementation("androidx.core:core-ktx:1.15.0")
    implementation("androidx.activity:activity-compose:1.10.1")
    implementation("androidx.compose.ui:ui:1.7.8")
    implementation("androidx.compose.ui:ui-tooling-preview:1.7.8")
    implementation("androidx.compose.material3:material3:1.3.1")
    implementation("androidx.compose.material:material-icons-extended:1.7.8")
    debugImplementation("androidx.compose.ui:ui-tooling:1.7.8")
}
'''
          if old not in s:
              raise SystemExit('dependency block not found')
          p.write_text(s.replace(old, new))
          PY

      - name: Build debug APK
        working-directory: /tmp/reclaim-src/Reclaim
        run: gradle --no-daemon :app:assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Reclaim-v0.1-apk
          path: /tmp/reclaim-src/Reclaim/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
