name: Temporary Reclaim Android v0.4.2 beta3 Build

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/reclaim-android-v041-beta2-build.yml'

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
    steps:
      - name: Checkout verified feature source branch
        uses: actions/checkout@v4
        with:
          ref: reclaim-v04-beta1-build2

      - name: Reconstruct, verify and patch beta1 feature source
        shell: bash
        run: |
          set -euo pipefail
          cat \
            .reclaim-v04-beta1-feature/part00 \
            .reclaim-v04-beta1-feature/part00b \
            .reclaim-v04-beta1-feature/part00c \
            .reclaim-v04-beta1-feature/part01 \
            .reclaim-v04-beta1-feature/part02 \
            .reclaim-v04-beta1-feature/part03a \
            .reclaim-v04-beta1-feature/part03b \
            .reclaim-v04-beta1-feature/part03c \
            .reclaim-v04-beta1-feature/part03d \
            .reclaim-v04-beta1-feature/part04 \
            > /tmp/reclaim-feature.b64
          base64 --decode /tmp/reclaim-feature.b64 > /tmp/Reclaim-v0.4-beta1-feature-source.zip
          echo '9778ef98f4f3c916f393f8ce07319f8c154147a17e937b0495aacea13a74e084  /tmp/Reclaim-v0.4-beta1-feature-source.zip' | sha256sum -c -
          unzip -t /tmp/Reclaim-v0.4-beta1-feature-source.zip >/dev/null
          rm -rf /tmp/reclaim-v04-beta3
          mkdir -p /tmp/reclaim-v04-beta3
          unzip -q /tmp/Reclaim-v0.4-beta1-feature-source.zip -d /tmp/reclaim-v04-beta3
          cd /tmp/reclaim-v04-beta3/reclaim_feature_android_beta
          patch -p1 < "$GITHUB_WORKSPACE/.reclaim-v04-beta1-feature/compile-fixes.patch"
          grep -q 'versionCode = 5' app/build.gradle.kts
          grep -q 'versionName = "0.4.0-beta1"' app/build.gradle.kts

      - name: Apply beta3 stable overlay fix and UI changes
        shell: python
        run: |
          from pathlib import Path
          root = Path('/tmp/reclaim-v04-beta3/reclaim_feature_android_beta')
          overlay = Path('.reclaim-v04-beta2-overrides/WorkBlockAccessibilityService.kt').read_text()

          old_own = '''        if (packageName == applicationContext.packageName) {
            frictionBypassPackage = null
            removeFrictionOverlay()
            return
        }'''
          new_own = '''        if (packageName == applicationContext.packageName) {
            // Accessibility overlays themselves emit events as com.kostas.reclaim.
            // Ignore those events; only reset state when the real Reclaim activity opens.
            val ownClass = event.className?.toString().orEmpty()
            if (event.eventType == AccessibilityEvent.TYPE_WINDOW_STATE_CHANGED &&
                ownClass == MainActivity::class.java.name) {
                frictionBypassPackage = null
                removeFrictionOverlay()
            }
            return
        }'''
          if old_own not in overlay:
              raise SystemExit('Expected buggy own-package block not found')
          overlay = overlay.replace(old_own, new_own)

          overlay = overlay.replace(
              'if (!active && packageName in repo.frictionPackages() && packageName != frictionBypassPackage)',
              'if (packageName in repo.frictionPackages() && packageName != frictionBypassPackage)'
          )
          if 'if (!active && packageName in repo.frictionPackages()' in overlay:
              raise SystemExit('Could not enable pause screen during allowed focus apps')
          (root/'app/src/main/java/com/kostas/reclaim/WorkBlockAccessibilityService.kt').write_text(overlay)

          gradle_path = root/'app/build.gradle.kts'
          gradle = gradle_path.read_text()
          gradle = gradle.replace('versionCode = 5', 'versionCode = 7')
          gradle = gradle.replace('versionName = "0.4.0-beta1"', 'versionName = "0.4.2-beta3"')
          gradle_path.write_text(gradle)

          hub_path = root/'app/src/main/java/com/kostas/reclaim/FeatureHubScreen.kt'
          hub = hub_path.read_text()
          hub = hub.replace('Selected apps are interrupted with a reason prompt and countdown when you open them outside a focus session.', 'Selected apps show a Reclaim pause over the app every time you enter them. The app stays open underneath while you wait and choose why you opened it.')
          hub = hub.replace('Manage distraction apps', 'Choose apps for pause screen')
          hub = hub.replace('Distraction apps', 'Pause screen apps')
          hub_path.write_text(hub)

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK
        shell: bash
        run: |
          set -euo pipefail
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platforms;android-35" "build-tools;35.0.0" "platform-tools"

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v5
        with:
          gradle-version: '8.9'

      - name: Build Android release
        working-directory: /tmp/reclaim-v04-beta3/reclaim_feature_android_beta
        run: gradle --no-daemon :app:assembleRelease --stacktrace

      - name: Download permanent Reclaim signing key
        uses: actions/download-artifact@v5
        with:
          name: Reclaim-signing-backup-v0.2
          path: /tmp/reclaim-signing-artifact
          github-token: ${{ github.token }}
          repository: kotskots/kotskots.github.io
          run-id: 36263273293

      - name: Sign and verify APK
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/reclaim-signing
          mkdir -p /tmp/reclaim-signing
          unzip -q /tmp/reclaim-signing-artifact/Reclaim-signing-backup-v0.2.zip -d /tmp/reclaim-signing
          PASS=$(cat /tmp/reclaim-signing/reclaim-keystore-password.txt)
          UNSIGNED=/tmp/reclaim-v04-beta3/reclaim_feature_android_beta/app/build/outputs/apk/release/app-release-unsigned.apk
          ALIGNED=/tmp/Reclaim-v0.4.2-beta3-aligned.apk
          SIGNED=/tmp/Reclaim-v0.4.2-beta3.apk
          ZIPALIGN="$ANDROID_HOME/build-tools/35.0.0/zipalign"
          APKSIGNER="$ANDROID_HOME/build-tools/35.0.0/apksigner"
          AAPT="$ANDROID_HOME/build-tools/35.0.0/aapt"
          "$ZIPALIGN" -p -f 4 "$UNSIGNED" "$ALIGNED"
          "$APKSIGNER" sign \
            --ks /tmp/reclaim-signing/reclaim-release.jks \
            --ks-key-alias reclaim \
            --ks-pass "pass:$PASS" \
            --key-pass "pass:$PASS" \
            --v2-signing-enabled true \
            --v3-signing-enabled true \
            --out "$SIGNED" \
            "$ALIGNED"
          "$APKSIGNER" verify --verbose --print-certs "$SIGNED" | tee /tmp/Reclaim-v0.4.2-beta3-signature.txt
          "$ZIPALIGN" -c -v 4 "$SIGNED" >/dev/null
          "$AAPT" dump badging "$SIGNED" | head -n 3 | tee /tmp/Reclaim-v0.4.2-beta3-package.txt
          grep -q "package: name='com.kostas.reclaim' versionCode='7' versionName='0.4.2-beta3'" /tmp/Reclaim-v0.4.2-beta3-package.txt
          grep -q "Verified using v2 scheme (APK Signature Scheme v2): true" /tmp/Reclaim-v0.4.2-beta3-signature.txt
          grep -q "Verified using v3 scheme (APK Signature Scheme v3): true" /tmp/Reclaim-v0.4.2-beta3-signature.txt
          grep -qi 'd5933ab2b7662c1606fb6b63e422eafe417e690fc5ca057de52d72cce571cd83' /tmp/Reclaim-v0.4.2-beta3-signature.txt
          sha256sum "$SIGNED" | tee /tmp/Reclaim-v0.4.2-beta3-sha256.txt

      - name: Upload Android APK
        uses: actions/upload-artifact@v4
        with:
          name: Reclaim-v0.4.2-beta3-Android
          path: |
            /tmp/Reclaim-v0.4.2-beta3.apk
            /tmp/Reclaim-v0.4.2-beta3-signature.txt
            /tmp/Reclaim-v0.4.2-beta3-package.txt
            /tmp/Reclaim-v0.4.2-beta3-sha256.txt
          if-no-files-found: error
