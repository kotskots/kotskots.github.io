name: Reclaim Android v0.4.3 beta4 Build

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/reclaim-android-v043-beta4-build.yml'

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
    steps:
      - name: Checkout build patches
        uses: actions/checkout@v4

      - name: Checkout verified Reclaim feature source
        uses: actions/checkout@v4
        with:
          ref: reclaim-v04-beta1-build2
          path: reclaim-source

      - name: Reconstruct beta2-compatible source and apply beta4 patch
        shell: bash
        run: |
          set -euo pipefail
          cat \
            reclaim-source/.reclaim-v04-beta1-feature/part00 \
            reclaim-source/.reclaim-v04-beta1-feature/part00b \
            reclaim-source/.reclaim-v04-beta1-feature/part00c \
            reclaim-source/.reclaim-v04-beta1-feature/part01 \
            reclaim-source/.reclaim-v04-beta1-feature/part02 \
            reclaim-source/.reclaim-v04-beta1-feature/part03a \
            reclaim-source/.reclaim-v04-beta1-feature/part03b \
            reclaim-source/.reclaim-v04-beta1-feature/part03c \
            reclaim-source/.reclaim-v04-beta1-feature/part03d \
            reclaim-source/.reclaim-v04-beta1-feature/part04 \
            > /tmp/reclaim-feature.b64
          base64 --decode /tmp/reclaim-feature.b64 > /tmp/Reclaim-v0.4-beta1-feature-source.zip
          echo '9778ef98f4f3c916f393f8ce07319f8c154147a17e937b0495aacea13a74e084  /tmp/Reclaim-v0.4-beta1-feature-source.zip' | sha256sum -c -
          rm -rf /tmp/reclaim-v043-beta4
          mkdir -p /tmp/reclaim-v043-beta4
          unzip -q /tmp/Reclaim-v0.4-beta1-feature-source.zip -d /tmp/reclaim-v043-beta4
          cd /tmp/reclaim-v043-beta4/reclaim_feature_android_beta
          patch -p1 < "$GITHUB_WORKSPACE/reclaim-source/.reclaim-v04-beta1-feature/compile-fixes.patch"

          # Reproduce the beta2 UI baseline. For the accessibility service,
          # temporarily restore the one-line own-package handler expected by
          # the verified beta4 patch; beta4 then applies the stable no-flash fix.
          cp "$GITHUB_WORKSPACE/reclaim-source/.reclaim-v04-beta2-overrides/WorkBlockAccessibilityService.kt" \
             app/src/main/java/com/kostas/reclaim/WorkBlockAccessibilityService.kt
          python - <<'PY'
          from pathlib import Path
          root = Path('/tmp/reclaim-v043-beta4/reclaim_feature_android_beta')
          gradle = root/'app/build.gradle.kts'
          s = gradle.read_text()
          s = s.replace('versionCode = 5', 'versionCode = 6')
          s = s.replace('versionName = "0.4.0-beta1"', 'versionName = "0.4.1-beta2"')
          gradle.write_text(s)

          hub = root/'app/src/main/java/com/kostas/reclaim/FeatureHubScreen.kt'
          h = hub.read_text()
          h = h.replace('Selected apps are interrupted with a reason prompt and countdown when you open them outside a focus session.', 'Selected apps show a Reclaim pause over the app every time you enter them. The app stays open underneath while you wait and choose why you opened it.')
          h = h.replace('Manage distraction apps', 'Choose apps for pause screen')
          h = h.replace('Distraction apps', 'Pause screen apps')
          hub.write_text(h)

          service = root/'app/src/main/java/com/kostas/reclaim/WorkBlockAccessibilityService.kt'
          w = service.read_text()
          old = '''        if (packageName == applicationContext.packageName) {
              frictionBypassPackage = null
              removeFrictionOverlay()
              return
          }'''
          if old not in w:
              old = '''        if (packageName == applicationContext.packageName) {
              frictionBypassPackage = null
              removeFrictionOverlay()
              return
          }'''.replace('              ', '            ')
          if old not in w:
              raise SystemExit('Expected beta2 own-package block not found')
          w = w.replace(old, '        if (packageName == applicationContext.packageName) return')
          service.write_text(w)
          PY

          base64 --decode "$GITHUB_WORKSPACE/.reclaim-build-patches/android-v043-beta4.patch.gz.b64" > /tmp/android-beta4.patch.gz
          gzip -dc /tmp/android-beta4.patch.gz > /tmp/android-beta4.patch
          echo '6177e6478d325196f994fa37e21414ae1dd61d63dfa2753c916ff993c6bb5e24  /tmp/android-beta4.patch' | sha256sum -c -
          patch -p1 < /tmp/android-beta4.patch
          grep -q 'versionCode = 8' app/build.gradle.kts
          grep -q 'versionName = "0.4.3-beta4"' app/build.gradle.kts
          grep -q 'fun isLockedActive' app/src/main/java/com/kostas/reclaim/FocusPreferences.kt
          grep -q 'ownClass == MainActivity::class.java.name' app/src/main/java/com/kostas/reclaim/WorkBlockAccessibilityService.kt

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK
        shell: bash
        run: |
          set -euo pipefail
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platforms;android-35" "build-tools;35.0.0" "platform-tools"

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v5
        with:
          gradle-version: '8.9'

      - name: Build Android release
        working-directory: /tmp/reclaim-v043-beta4/reclaim_feature_android_beta
        run: gradle --no-daemon :app:assembleRelease --stacktrace

      - name: Download permanent Reclaim signing key
        uses: actions/download-artifact@v5
        with:
          name: Reclaim-signing-backup-v0.2
          path: /tmp/reclaim-signing-artifact
          github-token: ${{ github.token }}
          repository: kotskots/kotskots.github.io
          run-id: 36263273293

      - name: Sign and verify APK
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/reclaim-signing
          mkdir -p /tmp/reclaim-signing
          unzip -q /tmp/reclaim-signing-artifact/Reclaim-signing-backup-v0.2.zip -d /tmp/reclaim-signing
          PASS=$(cat /tmp/reclaim-signing/reclaim-keystore-password.txt)
          UNSIGNED=/tmp/reclaim-v043-beta4/reclaim_feature_android_beta/app/build/outputs/apk/release/app-release-unsigned.apk
          ALIGNED=/tmp/Reclaim-v0.4.3-beta4-aligned.apk
          SIGNED=/tmp/Reclaim-v0.4.3-beta4.apk
          ZIPALIGN="$ANDROID_HOME/build-tools/35.0.0/zipalign"
          APKSIGNER="$ANDROID_HOME/build-tools/35.0.0/apksigner"
          AAPT="$ANDROID_HOME/build-tools/35.0.0/aapt"
          "$ZIPALIGN" -p -f 4 "$UNSIGNED" "$ALIGNED"
          "$APKSIGNER" sign \
            --ks /tmp/reclaim-signing/reclaim-release.jks \
            --ks-key-alias reclaim \
            --ks-pass "pass:$PASS" \
            --key-pass "pass:$PASS" \
            --v2-signing-enabled true \
            --v3-signing-enabled true \
            --out "$SIGNED" "$ALIGNED"
          "$APKSIGNER" verify --verbose --print-certs "$SIGNED" | tee /tmp/Reclaim-v0.4.3-beta4-signature.txt
          "$ZIPALIGN" -c -v 4 "$SIGNED" >/dev/null
          "$AAPT" dump badging "$SIGNED" | head -n 3 | tee /tmp/Reclaim-v0.4.3-beta4-package.txt
          grep -q "package: name='com.kostas.reclaim' versionCode='8' versionName='0.4.3-beta4'" /tmp/Reclaim-v0.4.3-beta4-package.txt
          grep -q "Verified using v2 scheme (APK Signature Scheme v2): true" /tmp/Reclaim-v0.4.3-beta4-signature.txt
          grep -q "Verified using v3 scheme (APK Signature Scheme v3): true" /tmp/Reclaim-v0.4.3-beta4-signature.txt
          grep -qi 'd5933ab2b7662c1606fb6b63e422eafe417e690fc5ca057de52d72cce571cd83' /tmp/Reclaim-v0.4.3-beta4-signature.txt
          sha256sum "$SIGNED" | tee /tmp/Reclaim-v0.4.3-beta4-sha256.txt

      - name: Upload Android beta4
        uses: actions/upload-artifact@v4
        with:
          name: Reclaim-v0.4.3-beta4-Android
          path: |
            /tmp/Reclaim-v0.4.3-beta4.apk
            /tmp/Reclaim-v0.4.3-beta4-signature.txt
            /tmp/Reclaim-v0.4.3-beta4-package.txt
            /tmp/Reclaim-v0.4.3-beta4-sha256.txt
          if-no-files-found: error
