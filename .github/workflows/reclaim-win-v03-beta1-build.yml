name: Temporary Reclaim Windows v0.3 beta1 Build

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/reclaim-win-v03-beta1-build.yml'

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 35
    steps:
      - name: Checkout feature source branch
        uses: actions/checkout@v4
        with:
          ref: reclaim-win-v03-beta1-build2

      - name: Set up .NET 8
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '8.0.x'

      - name: Extract and verify source
        shell: pwsh
        run: |
          $zip = Join-Path $env:GITHUB_WORKSPACE '.reclaim-win-v03-beta1\source.zip'
          if (-not (Test-Path $zip)) { throw 'Feature source ZIP missing' }
          $dst = Join-Path $env:RUNNER_TEMP 'reclaim-win-v03-beta1'
          Remove-Item -Recurse -Force $dst -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Path $dst | Out-Null
          tar -xf $zip -C $dst
          if ($LASTEXITCODE -ne 0) { throw 'tar extraction failed' }
          $proj = Join-Path $dst 'ReclaimWindows\ReclaimWindows.csproj'
          if (-not (Test-Path $proj)) { throw 'ReclaimWindows.csproj missing' }
          $text = Get-Content $proj -Raw
          if ($text -notmatch '<Version>0\.3\.0-beta1</Version>') { throw 'Wrong Windows beta version' }
          Write-Host "Source SHA256: $((Get-FileHash $zip -Algorithm SHA256).Hash.ToLower())"

      - name: Publish Windows x64 single-file app
        shell: pwsh
        run: |
          $root = Join-Path $env:RUNNER_TEMP 'reclaim-win-v03-beta1\ReclaimWindows'
          $proj = Join-Path $root 'ReclaimWindows.csproj'
          dotnet publish $proj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:DebugType=None -p:DebugSymbols=false
          if ($LASTEXITCODE -ne 0) { throw 'dotnet publish failed' }
          $exe = Join-Path $root 'bin\Release\net8.0-windows\win-x64\publish\ReclaimWindows.exe'
          if (-not (Test-Path $exe)) { throw 'ReclaimWindows.exe not produced' }
          Copy-Item $exe "$env:RUNNER_TEMP\ReclaimWindows-v0.3-beta1.exe"
          $readme = Join-Path $env:RUNNER_TEMP 'reclaim-win-v03-beta1\README.txt'
          if (Test-Path $readme) { Copy-Item $readme "$env:RUNNER_TEMP\ReclaimWindows-v0.3-beta1-README.txt" }
          Get-FileHash "$env:RUNNER_TEMP\ReclaimWindows-v0.3-beta1.exe" -Algorithm SHA256
          Get-Item "$env:RUNNER_TEMP\ReclaimWindows-v0.3-beta1.exe" | Format-List Name,Length,VersionInfo

      - name: Upload Windows beta
        uses: actions/upload-artifact@v4
        with:
          name: ReclaimWindows-v0.3-beta1
          path: |
            ${{ runner.temp }}\ReclaimWindows-v0.3-beta1.exe
            ${{ runner.temp }}\ReclaimWindows-v0.3-beta1-README.txt
          if-no-files-found: error
