name: Temporary Reclaim Windows v0.3 beta1 Build

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/reclaim-win-v03-beta1-build.yml'

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 35
    steps:
      - name: Checkout verified source branch
        uses: actions/checkout@v4
        with:
          ref: reclaim-win-v03-beta1-build3

      - name: Set up .NET 8
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '8.0.x'

      - name: Reconstruct alpha base and apply beta feature patch
        shell: pwsh
        run: |
          $names = @('part00','part01a','part01b','part02')
          $b64 = ($names | ForEach-Object { Get-Content (Join-Path '.reclaim-win-v03' $_) -Raw }) -join ''
          $zip = Join-Path $env:RUNNER_TEMP 'ReclaimWindows-v0.3-alpha1-source.zip'
          [IO.File]::WriteAllBytes($zip, [Convert]::FromBase64String($b64))

          $dst = Join-Path $env:RUNNER_TEMP 'reclaim-win-v03-beta1'
          Remove-Item -Recurse -Force $dst -ErrorAction SilentlyContinue
          Expand-Archive -Path $zip -DestinationPath $dst -Force
          $proj = Join-Path $dst 'ReclaimWindows\ReclaimWindows.csproj'
          if (-not (Test-Path $proj)) { throw 'Alpha base project missing' }

          $patchB64 = Get-Content '.reclaim-win-v03-beta1-patch\patch.gz.b64' -Raw
          $patchGz = Join-Path $env:RUNNER_TEMP 'beta.patch.gz'
          [IO.File]::WriteAllBytes($patchGz, [Convert]::FromBase64String($patchB64))
          $patchHash = (Get-FileHash $patchGz -Algorithm SHA256).Hash.ToLower()
          if ($patchHash -ne 'cac32906454b933892f7b4374ab74eb86c312c1e06501e35dd16314ce03e0268') { throw "Patch hash mismatch: $patchHash" }

          $patchFile = Join-Path $env:RUNNER_TEMP 'beta.patch'
          $input = [IO.File]::OpenRead($patchGz)
          $gzip = [IO.Compression.GzipStream]::new($input, [IO.Compression.CompressionMode]::Decompress)
          $output = [IO.File]::Create($patchFile)
          $gzip.CopyTo($output)
          $output.Dispose(); $gzip.Dispose(); $input.Dispose()

          Push-Location $dst
          git init | Out-Null
          git config user.name build
          git config user.email build@local
          git add .
          git commit -m alpha-base | Out-Null
          git apply --check $patchFile
          if ($LASTEXITCODE -ne 0) { throw 'Feature patch check failed' }
          git apply $patchFile
          if ($LASTEXITCODE -ne 0) { throw 'Feature patch apply failed' }
          Pop-Location

          $text = Get-Content $proj -Raw
          if ($text -notmatch '<Version>0\.3\.0-beta1</Version>') { throw 'Beta version was not applied' }
          Write-Host "Patch SHA256: $patchHash"

      - name: Publish Windows x64 single-file app
        shell: pwsh
        run: |
          $root = Join-Path $env:RUNNER_TEMP 'reclaim-win-v03-beta1\ReclaimWindows'
          $proj = Join-Path $root 'ReclaimWindows.csproj'
          dotnet publish $proj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:DebugType=None -p:DebugSymbols=false
          if ($LASTEXITCODE -ne 0) { throw 'dotnet publish failed' }
          $exe = Join-Path $root 'bin\Release\net8.0-windows\win-x64\publish\ReclaimWindows.exe'
          if (-not (Test-Path $exe)) { throw 'ReclaimWindows.exe not produced' }
          Copy-Item $exe "$env:RUNNER_TEMP\ReclaimWindows-v0.3-beta1.exe"
          $readme = Join-Path $env:RUNNER_TEMP 'reclaim-win-v03-beta1\README.txt'
          if (Test-Path $readme) { Copy-Item $readme "$env:RUNNER_TEMP\ReclaimWindows-v0.3-beta1-README.txt" }
          Get-FileHash "$env:RUNNER_TEMP\ReclaimWindows-v0.3-beta1.exe" -Algorithm SHA256
          Get-Item "$env:RUNNER_TEMP\ReclaimWindows-v0.3-beta1.exe" | Format-List Name,Length,VersionInfo

      - name: Upload Windows beta
        uses: actions/upload-artifact@v4
        with:
          name: ReclaimWindows-v0.3-beta1
          path: |
            ${{ runner.temp }}\ReclaimWindows-v0.3-beta1.exe
            ${{ runner.temp }}\ReclaimWindows-v0.3-beta1-README.txt
          if-no-files-found: error
