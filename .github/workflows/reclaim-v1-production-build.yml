name: Reclaim Android 1.0 Production Build

on:
  push:
    branches: [reclaim-v1-production-build]
    paths:
      - '.github/workflows/reclaim-v1-production-build.yml'
      - '.reclaim-v1-production/**'

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
    steps:
      - name: Checkout production build assets
        uses: actions/checkout@v4

      - name: Checkout verified Reclaim feature source
        uses: actions/checkout@v4
        with:
          ref: reclaim-v04-beta1-build2
          path: reclaim-source

      - name: Reconstruct verified beta4 source and apply Reclaim 1.0 patch
        shell: bash
        run: |
          set -euo pipefail

          cat \
            reclaim-source/.reclaim-v04-beta1-feature/part00 \
            reclaim-source/.reclaim-v04-beta1-feature/part00b \
            reclaim-source/.reclaim-v04-beta1-feature/part00c \
            reclaim-source/.reclaim-v04-beta1-feature/part01 \
            reclaim-source/.reclaim-v04-beta1-feature/part02 \
            reclaim-source/.reclaim-v04-beta1-feature/part03a \
            reclaim-source/.reclaim-v04-beta1-feature/part03b \
            reclaim-source/.reclaim-v04-beta1-feature/part03c \
            reclaim-source/.reclaim-v04-beta1-feature/part03d \
            reclaim-source/.reclaim-v04-beta1-feature/part04 \
            > /tmp/reclaim-feature.b64
          base64 --decode /tmp/reclaim-feature.b64 > /tmp/Reclaim-v0.4-beta1-feature-source.zip
          echo '9778ef98f4f3c916f393f8ce07319f8c154147a17e937b0495aacea13a74e084  /tmp/Reclaim-v0.4-beta1-feature-source.zip' | sha256sum -c -

          rm -rf /tmp/reclaim-v1
          mkdir -p /tmp/reclaim-v1
          unzip -q /tmp/Reclaim-v0.4-beta1-feature-source.zip -d /tmp/reclaim-v1
          cd /tmp/reclaim-v1/reclaim_feature_android_beta
          patch -p1 < "$GITHUB_WORKSPACE/reclaim-source/.reclaim-v04-beta1-feature/compile-fixes.patch"

          cp "$GITHUB_WORKSPACE/reclaim-source/.reclaim-v04-beta2-overrides/WorkBlockAccessibilityService.kt" \
             app/src/main/java/com/kostas/reclaim/WorkBlockAccessibilityService.kt

          python - <<'PY'
          from pathlib import Path
          import re
          root = Path('/tmp/reclaim-v1/reclaim_feature_android_beta')
          gradle = root/'app/build.gradle.kts'
          s = gradle.read_text()
          s = s.replace('versionCode = 5', 'versionCode = 6')
          s = s.replace('versionName = "0.4.0-beta1"', 'versionName = "0.4.1-beta2"')
          gradle.write_text(s)

          hub = root/'app/src/main/java/com/kostas/reclaim/FeatureHubScreen.kt'
          h = hub.read_text()
          h = h.replace('Selected apps are interrupted with a reason prompt and countdown when you open them outside a focus session.', 'Selected apps show a Reclaim pause over the app every time you enter them. The app stays open underneath while you wait and choose why you opened it.')
          h = h.replace('Manage distraction apps', 'Choose apps for pause screen')
          h = h.replace('Distraction apps', 'Pause screen apps')
          hub.write_text(h)

          service = root/'app/src/main/java/com/kostas/reclaim/WorkBlockAccessibilityService.kt'
          w = service.read_text()
          pattern = r'        if \(packageName == applicationContext\.packageName\) \{\s*frictionBypassPackage = null\s*removeFrictionOverlay\(\)\s*return\s*\}'
          w2, count = re.subn(pattern, '        if (packageName == applicationContext.packageName) return', w, count=1)
          if count != 1:
              raise SystemExit(f'Expected beta2 own-package block once, found {count}')
          service.write_text(w2)
          PY

          base64 --decode "$GITHUB_WORKSPACE/.reclaim-build-patches/android-v043-beta4.patch.gz.b64" > /tmp/android-beta4.patch.gz
          gzip -dc /tmp/android-beta4.patch.gz > /tmp/android-beta4.patch
          echo '6177e6478d325196f994fa37e21414ae1dd61d63dfa2753c916ff993c6bb5e24  /tmp/android-beta4.patch' | sha256sum -c -
          patch -p1 < /tmp/android-beta4.patch

          cat \
            "$GITHUB_WORKSPACE/.reclaim-v1-production/patch00" \
            "$GITHUB_WORKSPACE/.reclaim-v1-production/patch01" \
            "$GITHUB_WORKSPACE/.reclaim-v1-production/patch02" \
            "$GITHUB_WORKSPACE/.reclaim-v1-production/patch03" \
            > /tmp/reclaim-v1.patch.gz.b64
          base64 --decode /tmp/reclaim-v1.patch.gz.b64 > /tmp/reclaim-v1.patch.gz
          gzip -dc /tmp/reclaim-v1.patch.gz > /tmp/reclaim-v1.patch
          echo 'bd46993e550ff32098fc6b11f85154b445053f41c4c8c0c51f304227c3caa705  /tmp/reclaim-v1.patch' | sha256sum -c -

          # The beta4 build reconstructs the accessibility service from a verified
          # override, so apply the rest of the production patch and then replace
          # that one file with the exact final production source.
          python - <<'PY'
          from pathlib import Path
          p = Path('/tmp/reclaim-v1.patch').read_text()
          marker = 'diff --git a/app/src/main/java/com/kostas/reclaim/WorkBlockAccessibilityService.kt b/app/src/main/java/com/kostas/reclaim/WorkBlockAccessibilityService.kt\n'
          if marker not in p:
              raise SystemExit('WorkBlock patch marker missing')
          Path('/tmp/reclaim-v1-clean.patch').write_text(p.split(marker, 1)[0])
          PY
          patch --dry-run -p1 < /tmp/reclaim-v1-clean.patch
          patch -p1 < /tmp/reclaim-v1-clean.patch

          base64 --decode "$GITHUB_WORKSPACE/.reclaim-v1-production/workblock-final.kt.gz.b64" > /tmp/workblock-final.kt.gz
          gzip -dc /tmp/workblock-final.kt.gz > app/src/main/java/com/kostas/reclaim/WorkBlockAccessibilityService.kt
          echo '55884d71b1b545cab8d5fa201669413a82b84635ae1bffefb8c52a244a8daaad  app/src/main/java/com/kostas/reclaim/WorkBlockAccessibilityService.kt' | sha256sum -c -

          grep -q 'versionCode = 10' app/build.gradle.kts
          grep -q 'versionName = "1.0.0"' app/build.gradle.kts
          grep -q 'fun ProductionSmokingScreen' app/src/main/java/com/kostas/reclaim/ProductionScreens.kt
          grep -q 'fun ProductionSettingsScreen' app/src/main/java/com/kostas/reclaim/ProductionScreens.kt
          grep -q 'data class AppLimit' app/src/main/java/com/kostas/reclaim/Models.kt
          grep -q 'Reclaim 1.0 intentionally has no generic friction' app/src/main/java/com/kostas/reclaim/WorkBlockAccessibilityService.kt
          test ! -f app/src/main/java/com/kostas/reclaim/CloudSync.kt
          test ! -f app/src/main/java/com/kostas/reclaim/CloudSyncService.kt

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK
        shell: bash
        run: |
          set -euo pipefail
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platforms;android-35" "build-tools;35.0.0" "platform-tools"

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v5
        with:
          gradle-version: '8.9'

      - name: Build Reclaim 1.0 release
        working-directory: /tmp/reclaim-v1/reclaim_feature_android_beta
        run: gradle --no-daemon :app:assembleRelease --stacktrace

      - name: Download permanent Reclaim signing key
        uses: actions/download-artifact@v5
        with:
          name: Reclaim-signing-backup-v0.2
          path: /tmp/reclaim-signing-artifact
          github-token: ${{ github.token }}
          repository: kotskots/kotskots.github.io
          run-id: 36263273293

      - name: Sign and verify production APK
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/reclaim-signing
          mkdir -p /tmp/reclaim-signing
          unzip -q /tmp/reclaim-signing-artifact/Reclaim-signing-backup-v0.2.zip -d /tmp/reclaim-signing
          PASS=$(cat /tmp/reclaim-signing/reclaim-keystore-password.txt)
          UNSIGNED=/tmp/reclaim-v1/reclaim_feature_android_beta/app/build/outputs/apk/release/app-release-unsigned.apk
          ALIGNED=/tmp/Reclaim-v1.0.0-aligned.apk
          SIGNED=/tmp/Reclaim-v1.0.0.apk
          ZIPALIGN="$ANDROID_HOME/build-tools/35.0.0/zipalign"
          APKSIGNER="$ANDROID_HOME/build-tools/35.0.0/apksigner"
          AAPT="$ANDROID_HOME/build-tools/35.0.0/aapt"

          "$ZIPALIGN" -p -f 4 "$UNSIGNED" "$ALIGNED"
          "$APKSIGNER" sign \
            --ks /tmp/reclaim-signing/reclaim-release.jks \
            --ks-key-alias reclaim \
            --ks-pass "pass:$PASS" \
            --key-pass "pass:$PASS" \
            --v2-signing-enabled true \
            --v3-signing-enabled true \
            --out "$SIGNED" "$ALIGNED"

          "$APKSIGNER" verify --verbose --print-certs "$SIGNED" | tee /tmp/Reclaim-v1.0.0-signature.txt
          "$ZIPALIGN" -c -v 4 "$SIGNED" >/dev/null
          "$AAPT" dump badging "$SIGNED" | head -n 3 | tee /tmp/Reclaim-v1.0.0-package.txt
          grep -q "package: name='com.kostas.reclaim' versionCode='10' versionName='1.0.0'" /tmp/Reclaim-v1.0.0-package.txt
          grep -q "Verified using v2 scheme (APK Signature Scheme v2): true" /tmp/Reclaim-v1.0.0-signature.txt
          grep -q "Verified using v3 scheme (APK Signature Scheme v3): true" /tmp/Reclaim-v1.0.0-signature.txt
          grep -qi 'd5933ab2b7662c1606fb6b63e422eafe417e690fc5ca057de52d72cce571cd83' /tmp/Reclaim-v1.0.0-signature.txt
          sha256sum "$SIGNED" | tee /tmp/Reclaim-v1.0.0-sha256.txt

      - name: Upload Reclaim 1.0 production artifact
        uses: actions/upload-artifact@v4
        with:
          name: Reclaim-v1.0.0-Android
          path: |
            /tmp/Reclaim-v1.0.0.apk
            /tmp/Reclaim-v1.0.0-signature.txt
            /tmp/Reclaim-v1.0.0-package.txt
            /tmp/Reclaim-v1.0.0-sha256.txt
          if-no-files-found: error
