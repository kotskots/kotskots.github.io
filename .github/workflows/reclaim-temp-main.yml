name: Temporary Reclaim APK Build

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/reclaim-temp-main.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
    steps:
      - name: Checkout Reclaim build branch
        uses: actions/checkout@v4
        with:
          ref: reclaim-apk-build-v01

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK packages
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platforms;android-35" "build-tools;35.0.0" "platform-tools"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Reassemble and patch source project
        run: |
          cat .reclaim-build/part* > /tmp/reclaim.b64
          base64 --decode /tmp/reclaim.b64 > /tmp/Reclaim-v0.1.zip
          unzip -q /tmp/Reclaim-v0.1.zip -d /tmp/reclaim-src
          test -f /tmp/reclaim-src/Reclaim/app/build.gradle.kts
          echo 'cGx1Z2lucyB7CiAgICBpZCgiY29tLmFuZHJvaWQuYXBwbGljYXRpb24iKSB2ZXJzaW9uICI4LjcuMyIgYXBwbHkgZmFsc2UKICAgIGlkKCJvcmcuamV0YnJhaW5zLmtvdGxpbi5hbmRyb2lkIikgdmVyc2lvbiAiMi4wLjIxIiBhcHBseSBmYWxzZQogICAgaWQoIm9yZy5qZXRicmFpbnMua290bGluLnBsdWdpbi5jb21wb3NlIikgdmVyc2lvbiAiMi4wLjIxIiBhcHBseSBmYWxzZQp9Cg==' | base64 --decode > /tmp/reclaim-src/Reclaim/build.gradle.kts
          echo '' | base64 --decode > /tmp/reclaim-src/Reclaim/app/build.gradle.kts
          sed -i '/android.builtInKotlin=false/d' /tmp/reclaim-src/Reclaim/gradle.properties
          sed -i '/android.newDsl=false/d' /tmp/reclaim-src/Reclaim/gradle.properties

      - name: Build debug APK
        working-directory: /tmp/reclaim-src/Reclaim
        run: gradle --no-daemon :app:assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Reclaim-v0.1-apk
          path: /tmp/reclaim-src/Reclaim/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
