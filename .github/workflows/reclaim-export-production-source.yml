name: Reclaim export production source

on:
  push:
    branches: [reclaim-apk-build-20260929]
    paths:
      - '.github/workflows/reclaim-export-production-source.yml'

jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout production assets
        uses: actions/checkout@v4
        with:
          ref: reclaim-v1-production-build
          path: prod-assets

      - name: Checkout verified Reclaim feature source
        uses: actions/checkout@v4
        with:
          ref: reclaim-v04-beta1-build2
          path: reclaim-source

      - name: Reconstruct Reclaim 1.0 source
        shell: bash
        run: |
          set -euo pipefail
          cat \
            reclaim-source/.reclaim-v04-beta1-feature/part00 \
            reclaim-source/.reclaim-v04-beta1-feature/part00b \
            reclaim-source/.reclaim-v04-beta1-feature/part00c \
            reclaim-source/.reclaim-v04-beta1-feature/part01 \
            reclaim-source/.reclaim-v04-beta1-feature/part02 \
            reclaim-source/.reclaim-v04-beta1-feature/part03a \
            reclaim-source/.reclaim-v04-beta1-feature/part03b \
            reclaim-source/.reclaim-v04-beta1-feature/part03c \
            reclaim-source/.reclaim-v04-beta1-feature/part03d \
            reclaim-source/.reclaim-v04-beta1-feature/part04 \
            > /tmp/reclaim-feature.b64
          base64 --decode /tmp/reclaim-feature.b64 > /tmp/base.zip
          echo '9778ef98f4f3c916f393f8ce07319f8c154147a17e937b0495aacea13a74e084  /tmp/base.zip' | sha256sum -c -
          rm -rf /tmp/reclaim-v1 && mkdir -p /tmp/reclaim-v1
          unzip -q /tmp/base.zip -d /tmp/reclaim-v1
          cd /tmp/reclaim-v1/reclaim_feature_android_beta
          patch -p1 < "$GITHUB_WORKSPACE/reclaim-source/.reclaim-v04-beta1-feature/compile-fixes.patch"
          cp "$GITHUB_WORKSPACE/reclaim-source/.reclaim-v04-beta2-overrides/WorkBlockAccessibilityService.kt" app/src/main/java/com/kostas/reclaim/WorkBlockAccessibilityService.kt

          python - <<'PY'
          from pathlib import Path
          import re
          root=Path('/tmp/reclaim-v1/reclaim_feature_android_beta')
          g=root/'app/build.gradle.kts'
          s=g.read_text().replace('versionCode = 5','versionCode = 6').replace('versionName = "0.4.0-beta1"','versionName = "0.4.1-beta2"')
          g.write_text(s)
          hub=root/'app/src/main/java/com/kostas/reclaim/FeatureHubScreen.kt'
          h=hub.read_text().replace('Selected apps are interrupted with a reason prompt and countdown when you open them outside a focus session.','Selected apps show a Reclaim pause over the app every time you enter them. The app stays open underneath while you wait and choose why you opened it.').replace('Manage distraction apps','Choose apps for pause screen').replace('Distraction apps','Pause screen apps')
          hub.write_text(h)
          service=root/'app/src/main/java/com/kostas/reclaim/WorkBlockAccessibilityService.kt'
          w=service.read_text()
          pat=r'        if \(packageName == applicationContext\.packageName\) \{\s*frictionBypassPackage = null\s*removeFrictionOverlay\(\)\s*return\s*\}'
          w2,n=re.subn(pat,'        if (packageName == applicationContext.packageName) return',w,count=1)
          if n!=1: raise SystemExit(f'own-package normalize count={n}')
          service.write_text(w2)
          PY

          base64 --decode "$GITHUB_WORKSPACE/prod-assets/.reclaim-build-patches/android-v043-beta4.patch.gz.b64" > /tmp/b4.gz
          gzip -dc /tmp/b4.gz > /tmp/b4.patch
          patch -p1 < /tmp/b4.patch

          cat "$GITHUB_WORKSPACE/prod-assets/.reclaim-v1-production/patch00" "$GITHUB_WORKSPACE/prod-assets/.reclaim-v1-production/patch01" "$GITHUB_WORKSPACE/prod-assets/.reclaim-v1-production/patch02" "$GITHUB_WORKSPACE/prod-assets/.reclaim-v1-production/patch03" > /tmp/v1.b64
          base64 --decode /tmp/v1.b64 > /tmp/v1.gz
          gzip -dc /tmp/v1.gz > /tmp/v1.patch
          python - <<'PY'
          from pathlib import Path
          p=Path('/tmp/v1.patch').read_text()
          marker='diff --git a/app/src/main/java/com/kostas/reclaim/WorkBlockAccessibilityService.kt b/app/src/main/java/com/kostas/reclaim/WorkBlockAccessibilityService.kt\n'
          if marker not in p: raise SystemExit('WorkBlock marker missing')
          Path('/tmp/v1-clean.patch').write_text(p.split(marker,1)[0])
          PY
          patch -p1 < /tmp/v1-clean.patch

          base64 --decode "$GITHUB_WORKSPACE/prod-assets/.reclaim-v1-production/workblock-final.kt.gz.b64" > /tmp/wb.gz
          gzip -dc /tmp/wb.gz > app/src/main/java/com/kostas/reclaim/WorkBlockAccessibilityService.kt

          python - <<'PY'
          from pathlib import Path
          p=Path('app/src/main/java/com/kostas/reclaim/ProductionScreens.kt')
          lines=p.read_text().splitlines()
          hits=[]
          for i,line in enumerate(lines):
              if 'Emergency unlock' in line and line.lstrip().startswith('item{Card{Column'):
                  lines[i]=line+'}'
                  hits.append(i)
          if len(hits)!=1: raise SystemExit(f'Emergency Unlock line hits={len(hits)}')
          p.write_text('\n'.join(lines)+'\n')
          PY

          cd /tmp/reclaim-v1
          zip -qr /tmp/Reclaim-v1.0.0-reconstructed-source.zip reclaim_feature_android_beta

      - name: Upload reconstructed source
        uses: actions/upload-artifact@v4
        with:
          name: Reclaim-v1.0.0-reconstructed-source
          path: /tmp/Reclaim-v1.0.0-reconstructed-source.zip
          if-no-files-found: error
