name: Temporary Reclaim v0.4 beta1 Android Build

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/reclaim-v04-beta1-build.yml'

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
    steps:
      - name: Checkout feature build branch
        uses: actions/checkout@v4
        with:
          ref: reclaim-v04-beta1-build3

      - name: Reconstruct v0.4 alpha base
        shell: bash
        run: |
          set -euo pipefail
          cat .reclaim-v03/android/part* > /tmp/reclaim-v03.b64
          base64 --decode /tmp/reclaim-v03.b64 > /tmp/Reclaim-v0.3-source.zip
          unzip -t /tmp/Reclaim-v0.3-source.zip >/dev/null
          rm -rf /tmp/reclaim-v04
          mkdir -p /tmp/reclaim-v04
          unzip -q /tmp/Reclaim-v0.3-source.zip -d /tmp/reclaim-v04
          cd /tmp/reclaim-v04/Reclaim
          patch -p1 < "$GITHUB_WORKSPACE/.reclaim-v04/reclaim-v04.patch"
          cp "$GITHUB_WORKSPACE/.reclaim-v04/CloudSync.kt" app/src/main/java/com/kostas/reclaim/CloudSync.kt
          cp "$GITHUB_WORKSPACE/.reclaim-v04/CloudSyncService.kt" app/src/main/java/com/kostas/reclaim/CloudSyncService.kt

      - name: Apply beta feature patch
        shell: bash
        run: |
          set -euo pipefail
          { head -c 4261 .reclaim-v04-beta1b/part00; printf 'w'; tail -c +4262 .reclaim-v04-beta1b/part00; cat .reclaim-v04-beta1b/part01 .reclaim-v04-beta1b/part02 .reclaim-v04-beta1b/part03 .reclaim-v04-beta1b/part04 .reclaim-v04-beta1b/part05 .reclaim-v04-beta1b/part06; } > /tmp/reclaim-beta-patch.b64
          test "$(wc -c < /tmp/reclaim-beta-patch.b64)" -eq 48364
          base64 --decode /tmp/reclaim-beta-patch.b64 > /tmp/reclaim-v04-beta1.patch.gz
          echo 'fba2c66f00ee626080b183da93b0a8b4266fe0ddd56e49346762ed77e954e6b2  /tmp/reclaim-v04-beta1.patch.gz' | sha256sum -c -
          gzip -dc /tmp/reclaim-v04-beta1.patch.gz > /tmp/reclaim-v04-beta1.patch
          cd /tmp/reclaim-v04/Reclaim
          patch -p1 < /tmp/reclaim-v04-beta1.patch
          grep -q 'versionCode = 5' app/build.gradle.kts
          grep -q 'versionName = "0.4.0-beta1"' app/build.gradle.kts
          test -f app/src/main/java/com/kostas/reclaim/DistractionManager.kt
          test -f app/src/main/java/com/kostas/reclaim/FrictionActivity.kt

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK
        shell: bash
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platforms;android-35" "build-tools;35.0.0" "platform-tools"

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v5
        with:
          gradle-version: '8.9'

      - name: Build Android release
        working-directory: /tmp/reclaim-v04/Reclaim
        run: gradle --no-daemon :app:assembleRelease --stacktrace

      - name: Download permanent Reclaim signing key
        uses: actions/download-artifact@v5
        with:
          name: Reclaim-signing-backup-v0.2
          path: /tmp/reclaim-signing-artifact
          github-token: ${{ github.token }}
          repository: kotskots/kotskots.github.io
          run-id: 36263273293

      - name: Sign and verify APK
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/reclaim-signing
          unzip -q /tmp/reclaim-signing-artifact/Reclaim-signing-backup-v0.2.zip -d /tmp/reclaim-signing
          PASS=$(cat /tmp/reclaim-signing/reclaim-keystore-password.txt)
          UNSIGNED=/tmp/reclaim-v04/Reclaim/app/build/outputs/apk/release/app-release-unsigned.apk
          ALIGNED=/tmp/Reclaim-v0.4-beta1-aligned.apk
          SIGNED=/tmp/Reclaim-v0.4-beta1.apk
          ZIPALIGN="$ANDROID_HOME/build-tools/35.0.0/zipalign"
          APKSIGNER="$ANDROID_HOME/build-tools/35.0.0/apksigner"
          AAPT="$ANDROID_HOME/build-tools/35.0.0/aapt"
          "$ZIPALIGN" -p -f 4 "$UNSIGNED" "$ALIGNED"
          "$APKSIGNER" sign \
            --ks /tmp/reclaim-signing/reclaim-release.jks \
            --ks-key-alias reclaim \
            --ks-pass "pass:$PASS" \
            --key-pass "pass:$PASS" \
            --v1-signing-enabled true \
            --v2-signing-enabled true \
            --v3-signing-enabled true \
            --out "$SIGNED" \
            "$ALIGNED"
          "$APKSIGNER" verify --verbose --print-certs "$SIGNED" | tee /tmp/reclaim-signature.txt
          "$ZIPALIGN" -c -v 4 "$SIGNED" >/dev/null
          "$AAPT" dump badging "$SIGNED" | head -n 3 | tee /tmp/reclaim-package.txt
          grep -q "package: name='com.kostas.reclaim' versionCode='5' versionName='0.4.0-beta1'" /tmp/reclaim-package.txt
          grep -q "Verified using v2 scheme (APK Signature Scheme v2): true" /tmp/reclaim-signature.txt
          grep -q "Verified using v3 scheme (APK Signature Scheme v3): true" /tmp/reclaim-signature.txt
          grep -q 'd5933ab2b7662c1606fb6b63e422eafe417e690fc5ca057de52d72cce571cd83' <(tr -d ':' < /tmp/reclaim-signature.txt | tr '[:upper:]' '[:lower:]')

      - name: Upload Android APK
        uses: actions/upload-artifact@v4
        with:
          name: Reclaim-v0.4-beta1-Android
          path: /tmp/Reclaim-v0.4-beta1.apk
          if-no-files-found: error
