name: Temporary Reclaim v0.2 Build

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/reclaim-v02-build.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
    steps:
      - name: Checkout build branch
        uses: actions/checkout@v4
        with:
          ref: reclaim-apk-build-v01

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platforms;android-35" "build-tools;35.0.0" "platform-tools"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Reassemble source
        run: |
          cat .reclaim-v02/part* > /tmp/reclaim-v02.b64
          base64 --decode /tmp/reclaim-v02.b64 > /tmp/Reclaim-v0.2-source.zip
          unzip -q /tmp/Reclaim-v0.2-source.zip -d /tmp/reclaim-v02-src
          test -f /tmp/reclaim-v02-src/Reclaim/app/build.gradle.kts

      - name: Build release APK
        working-directory: /tmp/reclaim-v02-src/Reclaim
        run: gradle --no-daemon :app:assembleRelease --stacktrace

      - name: Upload unsigned APK
        uses: actions/upload-artifact@v4
        with:
          name: Reclaim-v0.2-unsigned
          path: /tmp/reclaim-v02-src/Reclaim/app/build/outputs/apk/release/app-release-unsigned.apk
          if-no-files-found: error
