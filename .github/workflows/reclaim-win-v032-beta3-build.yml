name: Reclaim Windows v0.3.2 beta3 Build

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/reclaim-win-v032-beta3-build.yml'

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 35
    steps:
      - name: Checkout build patches
        uses: actions/checkout@v4

      - name: Checkout verified Reclaim source assets
        uses: actions/checkout@v4
        with:
          ref: reclaim-win-v03-beta1-build3
          path: reclaim-source

      - name: Set up .NET 8
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '8.0.x'

      - name: Reconstruct verified beta1 and apply beta3 patch
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $src = Join-Path $env:GITHUB_WORKSPACE 'reclaim-source'
          $dst = Join-Path $env:RUNNER_TEMP 'reclaim-win-v032-beta3'
          Remove-Item -Recurse -Force $dst -ErrorAction SilentlyContinue

          Write-Host '1/6 Reconstruct alpha source from verified chunks'
          $alphaParts = @('part00','part01a','part01b','part02')
          $alpha64 = ($alphaParts | ForEach-Object { Get-Content (Join-Path $src ".reclaim-win-v03\$_") -Raw }) -join ''
          $alphaZip = Join-Path $env:RUNNER_TEMP 'ReclaimWindows-v0.3-alpha1-source.zip'
          [IO.File]::WriteAllBytes($alphaZip, [Convert]::FromBase64String($alpha64))
          Expand-Archive -Path $alphaZip -DestinationPath $dst -Force

          Write-Host '2/6 Reconstruct and apply verified beta1 patch'
          $beta64 = Get-Content (Join-Path $src '.reclaim-win-v03-beta1-patch\patch.gz.b64') -Raw
          $betaGz = Join-Path $env:RUNNER_TEMP 'windows-beta1.patch.gz'
          [IO.File]::WriteAllBytes($betaGz, [Convert]::FromBase64String($beta64))
          $betaPatch = Join-Path $env:RUNNER_TEMP 'windows-beta1.patch'
          $input = [IO.File]::OpenRead($betaGz)
          $gzip = [IO.Compression.GzipStream]::new($input, [IO.Compression.CompressionMode]::Decompress)
          $output = [IO.File]::Create($betaPatch)
          $gzip.CopyTo($output)
          $output.Dispose(); $gzip.Dispose(); $input.Dispose()

          Push-Location $dst
          git init | Out-Null
          git config user.name build
          git config user.email build@local
          git add .
          git commit -m alpha-base | Out-Null
          git apply --check $betaPatch
          if ($LASTEXITCODE -ne 0) { throw 'Verified beta1 patch check failed' }
          git apply $betaPatch
          if ($LASTEXITCODE -ne 0) { throw 'Verified beta1 patch apply failed' }
          Pop-Location

          Write-Host '3/6 Reconstruct fresh beta3 patch'
          $freshParts = 0..4 | ForEach-Object { '.reclaim-build-patches\windows-beta3-fresh\part{0:D2}' -f $_ }
          $fresh64 = ($freshParts | ForEach-Object { Get-Content $_ -Raw }) -join ''
          $freshGz = Join-Path $env:RUNNER_TEMP 'windows-beta3-fresh.patch.gz'
          [IO.File]::WriteAllBytes($freshGz, [Convert]::FromBase64String($fresh64))
          $freshPatch = Join-Path $env:RUNNER_TEMP 'windows-beta3-fresh.patch'
          $input = [IO.File]::OpenRead($freshGz)
          $gzip = [IO.Compression.GzipStream]::new($input, [IO.Compression.CompressionMode]::Decompress)
          $output = [IO.File]::Create($freshPatch)
          $gzip.CopyTo($output)
          $output.Dispose(); $gzip.Dispose(); $input.Dispose()
          $patchHash = (Get-FileHash $freshPatch -Algorithm SHA256).Hash.ToLower()
          Write-Host "Fresh patch SHA: $patchHash"
          if ($patchHash -ne 'defb30447a5b855a8b16321c5e20ea6a57a7ceee18c224bd255c5d097f4780a8') { throw "Fresh patch SHA mismatch: $patchHash" }

          Write-Host '4/6 Apply fresh beta3 patch'
          Push-Location $dst
          git add .
          git commit -m beta1-base | Out-Null
          git apply --check $freshPatch
          if ($LASTEXITCODE -ne 0) { throw 'Windows beta3 fresh patch check failed' }
          git apply $freshPatch
          if ($LASTEXITCODE -ne 0) { throw 'Windows beta3 fresh patch apply failed' }
          Pop-Location

          Write-Host '5/6 Verify features'
          $program = Join-Path $dst 'ReclaimWindows\Program.cs'
          $proj = Join-Path $dst 'ReclaimWindows\ReclaimWindows.csproj'
          if (-not (Test-Path $program)) { throw 'Program.cs missing' }
          if (-not (Test-Path $proj)) { throw 'ReclaimWindows.csproj missing' }
          $updated = Get-Content $proj -Raw
          if ($updated -notmatch '<Version>0\.3\.2-beta3</Version>') { throw 'Wrong beta3 version after patch' }
          $programText = Get-Content $program -Raw
          foreach ($needle in @('StartupTaskName', 'SettingsForm', 'IsLockedActive()', 'LOCKED UNTIL SESSION ENDS')) {
            if (-not $programText.Contains($needle)) { throw "Missing beta3 feature: $needle" }
          }

          Write-Host '6/6 Source ready'

      - name: Publish Windows x64 single-file app
        shell: pwsh
        run: |
          $root = Join-Path $env:RUNNER_TEMP 'reclaim-win-v032-beta3\ReclaimWindows'
          $proj = Join-Path $root 'ReclaimWindows.csproj'
          dotnet publish $proj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:DebugType=None -p:DebugSymbols=false
          if ($LASTEXITCODE -ne 0) { throw 'dotnet publish failed' }
          $exe = Join-Path $root 'bin\Release\net8.0-windows\win-x64\publish\ReclaimWindows.exe'
          if (-not (Test-Path $exe)) { throw 'ReclaimWindows.exe not produced' }
          $out = Join-Path $env:RUNNER_TEMP 'ReclaimWindows-v0.3.2-beta3.exe'
          Copy-Item $exe $out
          Get-FileHash $out -Algorithm SHA256 | Format-List
          Get-Item $out | Format-List Name,Length,VersionInfo

      - name: Upload Windows beta3
        uses: actions/upload-artifact@v4
        with:
          name: ReclaimWindows-v0.3.2-beta3
          path: ${{ runner.temp }}\ReclaimWindows-v0.3.2-beta3.exe
          if-no-files-found: error
