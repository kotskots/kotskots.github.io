name: Temporary Reclaim Windows v0.3 beta1 Feature Build

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/reclaim-win-v03-beta1-feature-build.yml'

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 35
    steps:
      - name: Checkout feature build branch
        uses: actions/checkout@v4
        with:
          ref: reclaim-win-v03-beta1-build3

      - name: Set up .NET 8
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '8.0.x'

      - name: Reconstruct verified alpha source and apply beta patch
        shell: pwsh
        run: |
          $names = @('part00','part01a','part01b','part02')
          $b64 = ($names | ForEach-Object { Get-Content (Join-Path '.reclaim-win-v03' $_) -Raw }) -join ''
          $zip = "$env:RUNNER_TEMP\ReclaimWindows-v0.3-alpha1-source.zip"
          [IO.File]::WriteAllBytes($zip, [Convert]::FromBase64String($b64))
          $hash = (Get-FileHash $zip -Algorithm SHA256).Hash.ToLower()
          if ($hash -ne 'a79853c679f016046968ae628d04c7f46ff8bd7bcca607efaf8c02a44af020b1') { throw "Alpha source hash mismatch: $hash" }
          $dst = "$env:RUNNER_TEMP\reclaim-win-beta"
          Remove-Item -Recurse -Force $dst -ErrorAction SilentlyContinue
          Expand-Archive -Path $zip -DestinationPath $dst -Force
          $patchB64 = Get-Content '.reclaim-win-v03-beta1\patch\part00' -Raw
          $patchGz = "$env:RUNNER_TEMP\win-beta.patch.gz"
          [IO.File]::WriteAllBytes($patchGz, [Convert]::FromBase64String($patchB64))
          $patchHash = (Get-FileHash $patchGz -Algorithm SHA256).Hash.ToLower()
          if ($patchHash -ne '8aa1db7878508dc90a67c1c0cde065f04e548158d494547e543ef426fce331c8') { throw "Patch hash mismatch: $patchHash" }
          $patch = "$env:RUNNER_TEMP\win-beta.patch"
          $in = [IO.File]::OpenRead($patchGz)
          $gz = New-Object IO.Compression.GzipStream($in, [IO.Compression.CompressionMode]::Decompress)
          $out = [IO.File]::Create($patch)
          $gz.CopyTo($out); $out.Close(); $gz.Close(); $in.Close()
          Push-Location $dst
          & 'C:\Program Files\Git\usr\bin\patch.exe' -p1 -i $patch
          if ($LASTEXITCODE -ne 0) { throw "Feature patch failed with $LASTEXITCODE" }
          Pop-Location
          if (-not (Test-Path "$dst\ReclaimWindows\ReclaimWindows.csproj")) { throw 'Project missing' }
          Select-String -Path "$dst\ReclaimWindows\Program.cs" -Pattern 'WhitelistMode' -Quiet | Out-Null
          Select-String -Path "$dst\ReclaimWindows\Program.cs" -Pattern 'TodayStats' -Quiet | Out-Null
          Select-String -Path "$dst\ReclaimWindows\ReclaimWindows.csproj" -Pattern '0.3.0-beta1' -Quiet | Out-Null

      - name: Build Windows x64 single-file app
        shell: pwsh
        run: |
          $proj = "$env:RUNNER_TEMP\reclaim-win-beta\ReclaimWindows\ReclaimWindows.csproj"
          dotnet publish $proj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:DebugType=None -p:DebugSymbols=false
          $exe = "$env:RUNNER_TEMP\reclaim-win-beta\ReclaimWindows\bin\Release\net8.0-windows\win-x64\publish\ReclaimWindows.exe"
          if (-not (Test-Path $exe)) { throw 'ReclaimWindows.exe not produced' }
          Copy-Item $exe "$env:RUNNER_TEMP\ReclaimWindows-v0.3-beta1.exe"
          Get-FileHash "$env:RUNNER_TEMP\ReclaimWindows-v0.3-beta1.exe" -Algorithm SHA256
          Get-Item "$env:RUNNER_TEMP\ReclaimWindows-v0.3-beta1.exe" | Format-List Name,Length,VersionInfo

      - name: Upload Windows app
        uses: actions/upload-artifact@v4
        with:
          name: ReclaimWindows-v0.3-beta1
          path: ${{ runner.temp }}\ReclaimWindows-v0.3-beta1.exe
          if-no-files-found: error
